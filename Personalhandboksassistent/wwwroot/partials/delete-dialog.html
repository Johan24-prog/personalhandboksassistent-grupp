<!-- Bekräftelseruta som visas innan ett dokument tas bort. -->
<dialog class="confirm-dialog" id="delete-dialog">
  <form method="dialog">
    <button class="dialog-close" aria-label="Stäng">×</button>
  </form>
  <div class="dialog-icon">!</div>
  <h2>Ta bort dokument?</h2>
  <p id="delete-copy">Dokumentet tas bort från biblioteket.</p>
  <div class="dialog-actions">
    <button class="button-secondary" type="button" id="cancel-delete">
      Avbryt</button
    ><button class="button-danger" type="button" id="confirm-delete">
      Ta bort
    </button>
  </div>
</dialog>
